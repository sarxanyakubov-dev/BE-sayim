<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stok sayımı</title>
<style>
:root{--bg:#f0f2f6;--card:#fff;--fg:#1b2230;--mut:#677389;--bd:#e1e5ed;--nav:#1f2a3d;--nav2:#34445f;--acc:#e3202e;--ok:#12804a;--okb:#e2f6ea;--bad:#c62828;--badb:#fdeaea;--cur:#fff3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1320;--card:#171e2e;--fg:#e8ecf4;--mut:#94a0b6;--bd:#26304a;--nav:#0a0f1b;--nav2:#1a2540;--okb:#12301f;--ok:#4ade80;--badb:#3a1618;--bad:#f87171;--cur:#3a3114}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1320;--card:#171e2e;--fg:#e8ecf4;--mut:#94a0b6;--bd:#26304a;--nav:#0a0f1b;--nav2:#1a2540;--okb:#12301f;--ok:#4ade80;--badb:#3a1618;--bad:#f87171;--cur:#3a3114}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:30}
.bar{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-0px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 170px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#ff4a58,var(--acc));display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:.5px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
h1{font-size:18px;margin:0;line-height:1.1}.brand span{font-size:12px;opacity:.72}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:9px 11px;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(227,32,46,.16)}
button{cursor:pointer;font-weight:600;transition:transform .08s}button:active{transform:scale(.96)}
.bar button{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.2);padding:8px 11px;font-size:13px}
.pri{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.nv{background:var(--nav)!important;color:#fff!important;border-color:var(--nav)!important}
#panel{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px max(12px,calc((100% - 876px)/2)) 10px;display:grid;gap:8px;box-shadow:0 8px 14px -12px rgba(0,0,0,.45)}
.r,.r2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.r2{flex-wrap:nowrap}.r2>*{flex:1 1 0}
.srch{display:flex;gap:8px}#s{flex:1;font-size:16px;padding:13px 14px}#q{width:78px;flex:none;text-align:center;font-size:17px;font-weight:700}
.big{flex:2!important;font-size:17px;padding:13px}
.sm{font-size:13px;color:var(--mut)}
#sl{font-size:13px;color:var(--ok);background:var(--okb);padding:7px 11px;border-radius:9px;font-weight:600}
#sg{max-height:36vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;display:grid;background:var(--card);box-shadow:0 8px 22px -10px rgba(0,0,0,.4)}
#sg button{text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;padding:10px 12px;font-weight:500}#sg b{font-weight:700}#sg small{display:block;color:var(--mut)}
#sg:empty,#sl:empty{display:none}
main{max-width:900px;margin:auto;padding:10px 12px 100px;display:grid;gap:10px}
#pbw{height:9px;background:var(--bd);border-radius:99px;overflow:hidden}#pb{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff7a6b);transition:width .3s}
#sum{display:flex;gap:6px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--mut)}.pill b{color:var(--fg)}.pill.ok b{color:var(--ok)}.pill.bad b{color:var(--bad)}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:3px;gap:2px}.seg .ch{flex:1;border:0;background:transparent;padding:8px 2px;font-size:13px;color:var(--mut);border-radius:10px}.seg .ch.on{background:var(--nav);color:#fff}
details.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--mut)}details.st .r2{margin-top:8px}
#ls{display:grid;gap:9px}#mo{width:100%}
.it{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:12px 13px 12px 17px;display:flex;gap:10px;align-items:center;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.06)}
.it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--bd)}.it.ok::before{background:var(--ok)}.it.bad::before{background:var(--bad)}
.it.fl{animation:f .9s}@keyframes f{from{background:var(--cur)}}
.inf{flex:1;min-width:0}.inf b{font-size:16px;display:block;letter-spacing:.2px}
.nmx{color:var(--mut);font-size:13px;margin:1px 0 6px;word-break:break-word}
.tg{display:flex;gap:4px;flex-wrap:wrap}.tg i{font-style:normal;font-size:11px;background:var(--bg);border:1px solid var(--bd);color:var(--mut);padding:1px 8px;border-radius:99px}.tg i.sr{color:#2563eb;border-color:#2563eb55}
.nm{text-align:center;font-size:12px;color:var(--mut);flex:none}
.cn{font-size:25px;font-weight:800;min-width:72px;padding:6px 10px;border-radius:12px;display:block;margin:3px auto 0;background:var(--bg)}
.ok .cn{color:var(--ok);background:var(--okb);border-color:transparent}.bad .cn{color:var(--bad);background:var(--badb);border-color:transparent}
.df{font-weight:700;color:var(--bad)}
#t{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:11px 14px;border-radius:14px;display:none;justify-content:space-between;gap:8px;align-items:center;z-index:60;max-width:860px;margin:auto;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
#t button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:7px 12px}
.em{text-align:center;color:var(--mut);padding:34px 10px}
#ak{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.akh{position:sticky;top:0;z-index:2;background:var(--nav);color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.akh button{padding:8px 12px}
.akb{max-width:900px;margin:auto;padding:10px 12px 60px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
textarea{font:inherit;width:100%;border:1px solid var(--bd);border-radius:11px;padding:10px;background:var(--card);color:var(--fg)}
#al{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.ac{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}.ac input{width:100%}.ac b{overflow-wrap:anywhere}
html,body{max-width:100%;overflow-x:hidden}
#panel,main,#ls,#sg{grid-template-columns:minmax(0,1fr)}
select,input{max-width:100%;text-overflow:ellipsis}
.r2>*,.srch>*,.bar *{min-width:0}
#panel .r2 select,details input{width:100%}
.inf,.inf b,.nmx,.tg{overflow-wrap:anywhere;min-width:0}
.seg .ch{padding-inline:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.acts{width:100%}.acts button{flex:1;padding:8px 4px;font-size:12.5px}#panel{padding-inline:10px}main{padding-inline:10px}.big{font-size:16px;padding:12px 6px}.r2 button{padding-inline:6px}.cn{min-width:60px;font-size:22px}.it{padding:11px 10px 11px 15px;gap:8px}}
#sv{position:fixed;inset:0;background:rgba(5,8,15,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:35;padding:10px;color:#fff}#rd{position:relative;width:min(100%,460px);border-radius:14px;overflow:hidden;background:#000}#vd{width:100%;max-height:62vh;object-fit:cover;display:block}#gd{position:absolute;left:4%;right:4%;top:25%;bottom:25%;border:2px solid #ff4655;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.38);pointer-events:none}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);width:min(92vw,420px);padding:16px}dialog::backdrop{background:rgba(0,0,0,.55)}dialog label{display:block;font-size:12px;color:var(--mut);margin-top:9px}dialog input,dialog select{width:100%}

.bar{border-bottom:3px solid var(--acc)}#mn{flex:none;padding:7px 13px;font-size:19px;line-height:1}#sd{white-space:nowrap}
#mw{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}#mw[hidden]{display:none}
#mp{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:10px;left:10px;max-width:380px;margin-left:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;display:grid;gap:7px;grid-template-columns:minmax(0,1fr);box-shadow:0 24px 48px -12px rgba(0,0,0,.55);max-height:calc(100vh - 30px);overflow:auto}
#mp button{text-align:left;width:100%;padding:12px 13px}#mp .dg{color:var(--bad);border-color:var(--badb)}#mp hr{border:0;border-top:1px solid var(--bd);margin:2px 0;width:100%}
#mp label{font-size:12px;color:var(--mut);display:grid;gap:3px}#mp input{width:100%}.mh{display:flex;justify-content:space-between;align-items:center}.mh button{width:auto!important;padding:6px 11px!important}
#mgl{line-height:1.7}
#wh{width:100%;font-weight:600}
</style>
</head>
<body>
<div class="bar"><div class="brand"><div class="logo">BE</div><div><h1>Stok sayımı</h1><span id="sub">Baku Electronics</span></div></div><div class="acts"><button id="sd" class="pri">📤 Sayımı göndər</button><button id="mn" aria-label="Menyu">☰</button></div></div>
<div id="mw" hidden><div id="mp">
<div class="mh"><b>Menyu</b><button id="mx">✕</button></div>
<button id="bl">📥 Baza yüklə (fiziki inventar)</button>
<button id="bs">🔢 Seriya (seri bilgiler girişdə olan)</button>
<button id="bb">🏷 Barkod (stok məlumat)</button>
<hr>
<button id="ak0">📄 Fərqlər aktı</button>
<button id="ex">⬇ Excel export (sayım aktı)</button>
<hr>
<button id="rc">📥 Sayımı qəbul et (JSON birləşdir)</button>
<div id="mgl" class="sm"></div>
<hr>

<div class="r2"><label>Filial<input id="fl"></label><label>Tarix<input id="dt" type="date"></label></div>
<label hidden><input id="ia" type="checkbox"></label>
<hr>
<button id="rs" class="dg">⟲ Bütün sayımı sıfırla</button>
</div></div>
<section id="panel">
 <input id="wh" placeholder="👤 Məsul şəxs" autocomplete="name"><div class="r2"><select id="dp"></select><select id="ct"></select></div>
 <div class="srch"><input id="s" placeholder="Kod / ad / barkod / seriya" autocomplete="off" enterkeyhint="done"><input id="q" type="number" step="any" min="0" value="1" title="Miqdar"></div>
 <div class="r2"><button id="sy" class="pri big">Say</button><button id="sc" class="nv">📷 Skan</button><button id="ax">+ Artıq</button></div>
 <div id="sl"></div><div id="sg"></div>
</section>
<main>
 <div id="pbw"><div id="pb"></div></div><div id="sum"></div>
 <div class="seg"><button class="ch on" data-f="ct">Sayılanlar</button><button class="ch" data-f="un">Sayılmayan</button><button class="ch" data-f="df">Fərqli</button><button class="ch" data-f="all">Hamısı</button></div>
 <div id="ls"></div>
</main>
<div id="ak"><div class="akh"><b>Sayım fərqi aktı</b><div class="r"><button id="akx" class="pri">⬇ Excel</button><button id="akc">Bağla</button></div></div><div class="akb"><div id="as" class="sm"></div><textarea id="gn" rows="2" placeholder="Ümumi qeyd (aktın altında çıxacaq)"></textarea><div id="al"></div></div></div>
<div id="t"><span id="tm"></span><button id="ud">Geri al</button></div>
<div id="sv"><div id="rd"><video id="vd" playsinline muted></video><div id="gd"></div></div><div class="sm" style="color:#ddd">Barkodu çərçivəyə tutun, hər oxunuş +1 əlavə edir. Kiçik barkod üçün zoom edin</div><input id="zm" type="range" style="display:none;width:min(80%,320px)"><div class="r"><button id="tc" style="display:none">🔦 Fənər</button><button id="ph">🖼 Şəkildən oxu</button><button id="sx">Bağla</button></div><input id="pf" type="file" accept="image/*" capture="environment" hidden></div>
<dialog id="xd"><b>Stokda olmayan (artıq) məhsul</b>
<label>Stok kodu</label><input id="xc"><label>Barkod</label><input id="xb"><label>Ad (ixtiyari)</label><input id="xn"><label>Ambar</label><select id="xp"></select><label>Kateqoriya</label><select id="xk"></select><label>Say</label><input id="xq" type="number" step="any" min="0" value="1">
<div class="r" style="margin-top:12px"><button id="xs" class="pri" style="flex:1">Əlavə et</button><button id="xx">Ləğv</button></div></dialog>
<input id="fi" type="file" accept=".xlsx,.xls" hidden><input id="fi2" type="file" accept=".xlsx,.xls" hidden><input id="fi3" type="file" accept=".xlsx,.xls" hidden><input id="fi4" type="file" accept=".json,application/json" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

const SH=["122-01","122-03,04,06","İT","Mobil","Smart saat","Aksesuar","Skin","Böyük ev avadanlığı","TV","Kiçik ev avadanlıqları","Hədiyyə Kartları","Gaming and Transport"];
const $=i=>document.getElementById(i);
let base=[],cnt={},hist=[],ts={},ser={},sr={},notes={},mg=[],flt="ct",meta={fl:"Xacmaz",dt:new Date().toISOString().slice(0,10),ia:false},lim=80;
function sheetOf(d,a1,a2,a3){
 if(d=="122-01")return SH[0]; if(d!="122-02")return SH[1];
 if(a1=="IT")return"İT"; if(a2=="Phones &Tabs")return"Mobil"; if(a2=="Gadgets")return"Smart saat";
 if(a2=="Car"||/^Gaming/.test(a1))return"Gaming and Transport";
 if(a1=="Accessories")return/skin/i.test(a3)?"Skin":"Aksesuar";
 if(a1=="Home Appliances")return"Böyük ev avadanlığı"; if(a1=="TV And AV")return"TV";
 if(a1=="Small Home Appliances")return"Kiçik ev avadanlıqları"; return"Hədiyyə Kartları";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=x=>+(+x).toFixed(2);
const V=v=>v==null?"":typeof v=="object"?(v.result??v.text??(v.richText?v.richText.map(t=>t.text).join(""):"")):v;
function save(){try{localStorage.setItem("sy1",JSON.stringify({base,cnt,ts,ser,sr,notes,mg,meta}))}catch(e){}}
function restore(){try{const o=JSON.parse(localStorage.getItem("sy1")||"null");if(o){base=o.base||[];cnt=o.cnt||{};ts=o.ts||{};ser=o.ser||{};sr=o.sr||{};notes=o.notes||{};mg=o.mg||[];meta=Object.assign(meta,o.meta||{})}}catch(e){}}
function toast(m,u){$("tm").textContent=m;$("ud").style.display=u?"":"none";$("t").style.display="flex";clearTimeout(toast.h);toast.h=setTimeout(()=>$("t").style.display="none",u?6000:3500)}
function opts(){
 const ds=[...new Map(base.map(r=>[r.d,r.dn])).entries()].sort();
 const dv=$("dp").value,cv=$("ct").value;
 $("dp").innerHTML='<option value="">Bütün ambarlar</option>'+ds.map(([d,n])=>`<option value="${esc(d)}">${esc(d)} · ${esc(String(n).replace(/^.*?-\s*/,""))}</option>`).join("");
 const cs=cats();
 $("ct").innerHTML='<option value="">Bütün kateqoriyalar</option>'+cs.map(s=>`<option>${esc(s)}</option>`).join("");
 $("dp").value=dv;$("ct").value=cv;
}

const idb=(m,k,v)=>new Promise(res=>{try{const o=indexedDB.open("sy",1);o.onupgradeneeded=()=>o.result.createObjectStore("kv");o.onsuccess=()=>{try{const s=o.result.transaction("kv",m=="get"?"readonly":"readwrite").objectStore("kv"),r=m=="get"?s.get(k):s.put(v,k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}};o.onerror=()=>res(null)}catch(e){res(null)}});
let bm2=new Map(),cb=new Map();
const nk=s=>{s=String(s).trim().toUpperCase();return/^\d+$/.test(s)?s.replace(/^0+/,""):s};
function setBc(arr){bm2=new Map();cb=new Map();for(const e of arr){const k=nk(e[0]);if(!k)continue;let l=bm2.get(k);if(!l){l=[];bm2.set(k,l)}l.push(e);if(!cb.has(e[1]))cb.set(e[1],e[0])}fillB()}
function fillB(){let n=0;base.forEach(r=>{if(!r.b&&cb.has(r.c)){r.b=String(cb.get(r.c));n++}});return n}
function byBc(raw){const l=bm2.get(nk(raw));if(!l)return null;const e=l.find(x=>base.some(r=>r.c==x[1]))||l[0];return{c:e[1],n:e[2],g:e[3]}}
async function loadBc(f){
 try{toast("Barkod bazası oxunur... bir az çəkə bilər");await new Promise(r=>setTimeout(r,60));
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array",dense:true,cellStyles:false,cellNF:false,cellHTML:false});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
  const h=rows[0].map(x=>String(x).trim().toUpperCase()),B=h.indexOf("BARKOD_KOD"),C=h.indexOf("STOK_KOD"),N=h.indexOf("STOK_AD"),G=["URUN_KOD_1","URUN_KOD_2","URUN_KOD_3","URUN_KOD_4"].map(x=>h.indexOf(x));
  if(B<0||C<0)throw new Error("BARKOD_KOD / STOK_KOD sütunu tapılmadı");
  const arr=[];for(let i=1;i<rows.length;i++){const r=rows[i],b=String(r[B]).trim(),c=String(r[C]).trim();if(b&&c)arr.push([b,c,N<0?"":String(r[N]).trim(),G.map(j=>j<0?"":String(r[j]).replace(/\s+/g," ").trim())])}
  setBc(arr);await idb("put","bc",arr);save();opts();render();toast(`Barkod bazası yükləndi: ${arr.length} sətir`);
 }catch(e){toast("Xəta: "+e.message)}
}

async function saveBlob(blob,fn){
 let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 if(dl){await dl.save({filename:fn,data:blob})}else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
 toast("Fayl hazırdır: "+fn);
}
async function sendCount(){
 if(!Object.keys(cnt).length)return toast("Göndəriləcək sayım yoxdur");
 let w=(meta.who||"").trim();if(!w){w=(prompt("Sayım edənin adı:","")||"").trim();if(!w)return;meta.who=w;$("wh").value=w;save()}
 const rows=base.filter(r=>cnt[r.k]!=null).map(r=>({k:r.k,d:r.d,dn:r.dn,c:r.c,n:r.n,b:r.b||"",q:r.q,sh:r.sh,g:r.g||[],x:r.x?1:0}));
 const o={app:"sayim",v:1,id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),who:w,fl:meta.fl,dt:meta.dt,ts:Date.now(),rows,cnt,ser,notes:Object.fromEntries(Object.entries(notes).filter(([k,v])=>cnt[k]!=null&&v))};
 const hm=new Date().toTimeString().slice(0,5).replace(":","");
 try{await saveBlob(new Blob([JSON.stringify(o)],{type:"application/json"}),`sayim_${w.replace(/[^\wəƏıİöÖüÜşŞçÇğĞ-]+/g,"_")}_${meta.dt}_${hm}.json`)}catch(e){if(e&&e.code=="declined")return toast("Ləğv edildi");toast("Xəta: "+(e.message||e))}
}
function renderMg(){$("mgl").innerHTML=mg.length?mg.map(m=>`✔ <b>${esc(m.who)}</b> · ${m.n} məhsul · ${m.tot} ədəd${m.ov?` · ${m.ov} üst-üstə`:""}`).join("<br>"):"Birləşdirilmiş fayl yoxdur"}
async function recvFiles(files){
 const rep=[];let ok=0;
 for(const f of files){
  let o;try{o=JSON.parse(await f.text())}catch(e){rep.push(f.name+": oxunmadı");continue}
  if(o.app!="sayim"||!o.cnt){rep.push(f.name+": uyğun fayl deyil");continue}
  if(mg.some(m=>m.id==o.id)){rep.push(esc(o.who)+": artıq birləşdirilib");continue}
  const inc={...o.cnt},bk=new Map(base.map(r=>[r.k,r]));
  for(const[sn,k]of Object.entries(o.ser||{})){if(ser[sn]){if(inc[k]>0)inc[k]=fm(inc[k]-1)}else ser[sn]=k}
  let n=0,tot=0,ov=0;
  for(const[k,v]of Object.entries(inc)){
   if(!bk.has(k)){const r=(o.rows||[]).find(x=>x.k==k);if(!r)continue;const nr={...r,x:r.x?1:0};if(!nr.x)delete nr.x;base.push(nr);bk.set(k,nr)}
   if(cnt[k]!=null)ov++;
   cnt[k]=Math.max(0,fm((cnt[k]||0)+v));ts[k]=Math.max(ts[k]||0,o.ts||0);n++;tot+=v;
  }
  for(const[k,v]of Object.entries(o.notes||{}))if(!notes[k])notes[k]=v;
  mg.push({id:o.id,who:o.who||"?",n,tot:fm(tot),ov});ok++;
  rep.push(`${esc(o.who)}: ${n} məhsul, ${fm(tot)} ədəd${ov?`, ${ov} üst-üstə düşdü (toplandı)`:""}`);
 }
 save();opts();render();renderMg();
 $("mw").hidden=false;$("mgl").innerHTML=rep.join("<br>")+"<hr>"+$("mgl").innerHTML;
 if(ok)toast(`${ok} fayl birləşdirildi`);
}

async function loadBase(f){
 try{
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
  const ws=wb.worksheets[0],h={};ws.getRow(1).eachCell((c,i)=>h[String(V(c.value)).trim()]=i);
  for(const k of["DEPO_KOD","STOK_KOD","STOK_AD","MIKTAR"])if(!h[k])throw new Error("Sütun tapılmadı: "+k);
  const g=(r,k)=>h[k]?V(r.getCell(h[k]).value):"",m=new Map(),bh=Object.keys(h).find(k=>/barkod|barcode/i.test(k));
  ws.eachRow((r,i)=>{if(i<2)return;const d=String(g(r,"DEPO_KOD")).trim(),c=String(g(r,"STOK_KOD")).trim();if(!d||!c)return;
   const k=d+"|"+c,q=+g(r,"MIKTAR")||0;
   if(m.has(k)){m.get(k).q+=q;return}
   m.set(k,{k,d,dn:g(r,"DEPO_AD"),c,b:bh?String(g(r,bh)).trim():"",n:String(g(r,"STOK_AD")),q,sh:"",g:["URUN_GRUP_AD1","URUN_GRUP_AD2","URUN_GRUP_AD3","URUN_GRUP_AD4"].map(k=>String(g(r,k)).trim())})});
  base=[...m.values(),...base.filter(r=>r.x&&!m.has(r.k))];setLv();fillB();save();opts();render();toast(`Baza yükləndi: ${m.size} sətir`);
 }catch(e){toast("Xəta: "+e.message)}
}
const dmy=s=>s.split("-").reverse().join(".");
const TN="Times New Roman",TH={style:"thin"},TB={left:TH,right:TH,top:TH,bottom:TH};
function edges(ws,r1,c1,r2,c2,st,col){
 for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const x=ws.getCell(r,c),b=Object.assign({},x.border||{}),e={style:st,color:{argb:col}};
  if(r==r1)b.top=e;if(r==r2)b.bottom=e;if(c==c1)b.left=e;if(c==c2)b.right=e;x.border=b}
}
function mk(wb,name,rows,img){
 const ws=wb.addWorksheet(shn(name),{views:[{showGridLines:false}],pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:"9:9",margins:{left:.24,right:.24,top:.65,bottom:.6,header:.28,footer:.28}},headerFooter:{oddHeader:"&L&F&C&A",oddFooter:"&LMəsul şəxs:_______________&C&P / &N"}});
 ws.columns=[3.2,10.8,36,75,9.2,15,14].map(width=>({width}));
 [4,5,6,7].forEach((r,i)=>ws.getRow(r).height=[14.25,18,18,14.25][i]);ws.getRow(9).height=33.75;
 ws.mergeCells("D1:G3");ws.mergeCells("B5:C5");ws.mergeCells("B6:C6");ws.mergeCells("D5:G7");
 const t=ws.getCell("D1");t.value="Həftəlik və Aylıq məhsul qalığının sayım forması";t.font={name:TN,size:13,bold:true,color:{argb:"FFFFFFFF"}};
 t.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF333F50"}};t.alignment={horizontal:"center",vertical:"center"};
 const b5=ws.getCell("B5");b5.value="Filial:"+meta.fl;b5.font={name:TN,size:14,bold:true};b5.alignment={vertical:"middle"};
 const b6=ws.getCell("B6");b6.value="Tarix: "+dmy(meta.dt);b6.font=b5.font;b6.alignment=b5.alignment;
 const R={name:TN,size:12,bold:true,color:{argb:"FFFF0000"}},K={name:TN,size:12};
 const n=ws.getCell("D5");n.value={richText:[{text:"Qeyd : ",font:R},{text:"Mağazanın həftəlik və aylıq sayımı bu forma üzərindən aparılmalıdır. Retail Audit yoxlaması zamanı uyğunsuzluq ",font:K},{text:"(tarixsiz,imzasız)",font:R},{text:" aşkarlanarsa sayım qeydə alınmayacaq.",font:K}]};
 n.alignment={horizontal:"left",vertical:"middle",wrapText:true};
 edges(ws,1,2,7,7,"medium","FF000000");edges(ws,5,4,7,7,"medium","FFFF0000");
 ["Depo","Stok Kodu","Stok Adı","Stok\nMiqdarı","Faktiki sayılan","Qeyd"].forEach((h,i)=>{const c=ws.getCell(9,i+2);c.value=h;c.font={name:TN,size:10,bold:true};c.border=TB;c.alignment={horizontal:"center",vertical:"middle",wrapText:true};
  c.fill={type:"gradient",gradient:"angle",degree:90,stops:[{position:0,color:{argb:"FFFFFFFF"}},{position:1,color:{argb:"FFF4B183"}}]}});
 rows.forEach((x,i)=>{const r=10+i,f=cnt[x.k]||0,row=ws.getRow(r);row.height=15.75;
  row.values=[null,x.d,x.c,x.n,x.q,f,{formula:`IF(E${r}=F${r},"OK","NOT OK")`,result:f==x.q?"OK":"NOT OK"}];
  for(let c=2;c<=7;c++){const e=ws.getCell(r,c);e.border=TB;e.font={name:c==2?TN:"Calibri",size:11};if(c>4)e.alignment={horizontal:"center",vertical:"middle"}}});
 const L=9+rows.length;ws.autoFilter=`B9:G${L}`;
 const s=L+3;[["Məsul şəxs :",12],["MƏMT : ",12],["MSM :",12]].forEach(([tx,sz],i)=>{
  const a=ws.getCell(s+i*3,3);a.value=tx;a.font={name:TN,size:sz};a.alignment={horizontal:"right",vertical:"middle"};
  const d=ws.getCell(s+i*3+1,4);d.value="ad/soyad/imza";d.font={name:TN,size:10};d.border={top:TH};d.alignment={horizontal:"center",vertical:"middle"}});
 ws.addImage(img,{tl:{col:1.1,row:.4},ext:{width:364,height:44}});
}
async function exportX(){
 const d=$("dp").value,c=$("ct").value,sc=base.filter(r=>(!d||r.d==d)&&(!c||r.sh==c)),used=[[c||d||"Sayım",sc]];
 if(!sc.some(r=>cnt[r.k]!=null))return toast("Seçilmiş ambar/kateqoriya üzrə sayılmış məhsul yoxdur");
 try{
  toast("Excel hazırlanır...");
  const wb=new ExcelJS.Workbook(),img=wb.addImage({base64:"data:image/png;base64,"+LOGO,extension:"png"});
  for(const[s,rs]of used)mk(wb,s,rs.slice().sort((a,b)=>(a.n||a.c).localeCompare(b.n||b.c,"az")),img);
  const blob=new Blob([await wb.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),fn=`Sayim_akti_${d?d+"_":""}${c?c.replace(/[^\wə-ʯ]+/g,"-")+"_":""}${dmy(meta.dt)}.xlsx`;
  let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(e){}
  if(dl){await dl.save({filename:fn,data:blob})}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click()}
  toast(`Export: ${used[0][1].length} sətir`);
 }catch(e){if(e&&e.code=="declined")return toast("Ləğv edildi");toast("Export xətası: "+(e.message||e))}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.sk)return pick(b.dataset.sk);
